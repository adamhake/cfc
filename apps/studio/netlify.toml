[build]
# Build from monorepo root using Turborepo
package = "apps/studio"
command = "pnpm run build --filter=@chimborazo/studio && cd apps/studio && pnpm sanity schema deploy"
publish = "apps/studio/dist"
# Skip the build only when nothing this app depends on changed. See the script
# for why a bare `git diff` here skips builds forever once the cache expires.
ignore = "bash \"$(git rev-parse --show-toplevel)/scripts/netlify-ignore.sh\" apps/studio"

[build.environment]
NODE_VERSION = "24"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
