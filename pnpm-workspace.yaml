packages:
  - apps/**
  - packages/**

# pnpm 11 renamed `onlyBuiltDependencies` to `allowBuilds`.
allowBuilds:
  '@parcel/watcher': true
  # Fetches its platform binary in postinstall; the CLI is unusable without it.
  '@posthog/cli': true
  '@swc/core': true
  # postinstall only prints a funding message.
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true

catalog:
  '@biomejs/biome': ^2.6.6
  '@sanity/client': ^8.15.0
  '@sanity/icons': ^5.3.0
  '@sanity/image-url': ^2.1.1
  '@sanity/types': ^6.22.0
  '@t3-oss/env-core': ^0.13.11
  '@total-typescript/ts-reset': ^0.6.1
  '@types/node': ^24.13.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  sanity: ^6.22.0
  typescript: ^7.0.2
  zod: ^4.6.7

# `sanity` depends on @sanity/client ^8.14.1 and @sanity/ui ^4.4.10, which can resolve
# a patch behind our own direct deps and produce two copies in the graph — the
# duplicate `SanityClient` types then fail to unify in apps/studio. Pin one 8.x
# and one 4.x. Scoped by range so next-sanity's own @sanity/client ^7 is
# untouched.
overrides:
  '@sanity/client@^8': 8.15.0
  '@sanity/ui@^4': 4.4.10
